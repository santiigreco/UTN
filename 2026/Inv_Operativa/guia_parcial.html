<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IO · 1er Parcial</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b12;--bg2:#12121c;--bg3:#0e0e17;
  --bgf:#0d1520;--bgt:#181200;--bgok:#091a0f;--bgno:#1a0909;
  --bd:#1e1e2e;--bd2:#2a2a3c;
  --tx:#ddd8cc;--tx2:#887f70;--tx3:#484440;
  --ac:#c8a020;--acd:#7a6218;--acl:#d4b030;
  --bl:#4d94ff;--ok:#52b374;--no:#d95f5f;
  --fh:'Playfair Display',Georgia,serif;
  --fb:'Source Sans 3',system-ui,sans-serif;
  --fm:'Fira Code',monospace;
  --r:8px;--rs:5px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:15px;line-height:1.65;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,0.035) 1px,transparent 0);background-size:28px 28px;pointer-events:none;z-index:0}

/* HEADER */
header{position:sticky;top:0;z-index:200;background:rgba(11,11,18,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hbrand h1{font-family:var(--fh);font-size:18px;font-weight:600;color:var(--ac);letter-spacing:.02em}
.hbrand p{font-size:11px;color:var(--tx3);letter-spacing:.12em;text-transform:uppercase;margin-top:1px}
.hright{display:flex;align-items:center;gap:12px}
#timer{font-family:var(--fm);font-size:16px;color:var(--ac);letter-spacing:.08em;display:none;min-width:55px;text-align:right}
#timer.urgent{color:var(--no);animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.btn-ex{background:transparent;border:1px solid var(--acd);color:var(--ac);padding:6px 14px;border-radius:var(--rs);font-family:var(--fb);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .2s}
.btn-ex:hover{background:rgba(200,160,32,.1);border-color:var(--ac)}
.btn-ex.on{background:var(--ac);color:#080808;border-color:var(--ac)}

/* TOPIC NAV */
#tnav{position:sticky;top:52px;z-index:190;background:rgba(11,11,18,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);display:flex;overflow-x:auto;scrollbar-width:none}
#tnav::-webkit-scrollbar{display:none}
.ttab{background:none;border:none;border-bottom:2px solid transparent;color:var(--tx2);padding:12px 18px 10px;font-family:var(--fb);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0}
.ttab:hover{color:var(--tx);background:rgba(255,255,255,.02)}
.ttab.on{color:var(--ac);border-bottom-color:var(--ac)}
.ttab .bdg{font-family:var(--fm);font-size:10px;padding:1px 7px;border-radius:10px;background:rgba(255,255,255,.05);color:var(--tx3);border:1px solid var(--bd);transition:all .3s}
.ttab.on .bdg{background:rgba(200,160,32,.12);color:var(--ac);border-color:rgba(200,160,32,.3)}
.ttab .bdg.done{background:rgba(82,179,116,.12);color:var(--ok);border-color:rgba(82,179,116,.3)}

/* MAIN */
main{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:28px 20px 80px}

/* TOPIC SECTIONS */
.tsec{display:none}
.tsec.on{display:block;animation:fup .3s ease forwards}
@keyframes fup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.thead{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--bd)}
.thead h2{font-family:var(--fh);font-size:26px;font-weight:600;color:var(--tx);margin-bottom:3px}
.thead p{font-size:13px;color:var(--tx2)}

/* PANEL SWITCHER */
.psw{display:flex;background:var(--bg3);border:1px solid var(--bd);border-radius:var(--rs);padding:3px;margin-bottom:20px;gap:2px}
.pbtn{flex:1;background:none;border:none;color:var(--tx2);padding:7px 12px;border-radius:4px;font-family:var(--fb);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.pbtn:hover{color:var(--tx)}
.pbtn.on{background:rgba(200,160,32,.1);color:var(--ac)}

/* PANELS */
.panel{display:none}
.panel.on{display:block;animation:fup .25s ease forwards}

/* TEORIA CARDS */
.tgrid{display:flex;flex-direction:column;gap:12px}
.tcard{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:18px 20px;transition:border-color .2s}
.tcard:hover{border-color:var(--bd2)}
.tcard-ttl{font-family:var(--fh);font-size:15px;color:var(--ac);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.tcard-ttl::before{content:'';width:3px;height:15px;background:var(--ac);border-radius:2px;flex-shrink:0}
.tcard ul{list-style:none;display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.tcard li{font-size:14px;color:var(--tx);padding-left:18px;position:relative}
.tcard li::before{content:'·';position:absolute;left:6px;color:var(--tx3)}
.fml{background:var(--bgf);border:1px solid rgba(77,148,255,.2);border-radius:5px;padding:8px 13px;font-family:var(--fm);font-size:13px;color:var(--bl);margin:6px 0 0;overflow-x:auto;white-space:pre}
.fml.blk{text-align:center;font-size:14px;padding:10px 14px}
.dgram{margin:12px 0 0;overflow-x:auto}

/* TIP CARDS */
.tipgrid{display:flex;flex-direction:column;gap:10px}
.tipcard{background:var(--bgt);border:1px solid rgba(200,160,32,.22);border-left:3px solid var(--ac);border-radius:0 var(--rs) var(--rs) 0;padding:13px 16px;display:flex;align-items:flex-start;gap:10px}
.tipcard.danger{background:#160808;border-color:rgba(217,95,95,.22);border-left-color:var(--no)}
.tipicon{font-size:15px;flex-shrink:0;margin-top:1px;line-height:1}
.tiplbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin-bottom:3px}
.tipcard.danger .tiplbl{color:var(--no)}
.tiptx{font-size:14px;color:var(--tx);line-height:1.55}
.tiptx code{font-family:var(--fm);font-size:12px;color:var(--bl);background:rgba(77,148,255,.08);padding:1px 6px;border-radius:3px}

/* QUESTIONS */
.qhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.qprog-txt{font-family:var(--fm);font-size:12px;color:var(--tx3)}
.qprog-txt span{color:var(--ac)}
.pbar{height:2px;background:var(--bd);border-radius:2px;margin-bottom:18px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--acd),var(--ac));border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.qlist{display:flex;flex-direction:column;gap:14px}
.qcard{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);padding:18px 20px;transition:border-color .3s}
.qcard.answered{border-color:#1e1e30}
.qmeta{display:flex;gap:7px;align-items:center;margin-bottom:11px;flex-wrap:wrap}
.qnum{font-family:var(--fm);font-size:11px;color:var(--tx3);background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:4px;padding:1px 7px}
.qtype{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);border:1px solid var(--bd);border-radius:10px;padding:1px 8px}
.qtxt{font-size:15px;color:var(--tx);line-height:1.55;margin-bottom:13px}
.opts{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.025);border:1px solid var(--bd);color:var(--tx);padding:10px 14px;border-radius:var(--rs);text-align:left;font-family:var(--fb);font-size:14px;cursor:pointer;transition:all .15s;width:100%}
.opt:hover:not(:disabled){background:rgba(255,255,255,.05);border-color:var(--bd2)}
.opt:disabled{cursor:default}
.oltr{font-family:var(--fm);font-size:11px;color:var(--tx3);flex-shrink:0;margin-top:2px;min-width:16px}
.opt.ok{background:var(--bgok);border-color:rgba(82,179,116,.5);color:var(--ok)}
.opt.ok .oltr{color:var(--ok)}
.opt.no{background:var(--bgno);border-color:rgba(217,95,95,.5);color:var(--no)}
.opt.no .oltr{color:var(--no)}
.tfrow{display:flex;gap:8px;margin-bottom:10px}
.tfbtn{flex:1;background:rgba(255,255,255,.025);border:1px solid var(--bd);color:var(--tx);padding:9px;border-radius:var(--rs);font-family:var(--fb);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;text-align:center}
.tfbtn:hover:not(:disabled){background:rgba(255,255,255,.05);border-color:var(--bd2)}
.tfbtn:disabled{cursor:default}
.tfbtn.ok{background:var(--bgok);border-color:rgba(82,179,116,.5);color:var(--ok)}
.tfbtn.no{background:var(--bgno);border-color:rgba(217,95,95,.5);color:var(--no)}
.revbtn{background:transparent;border:1px solid var(--bd);color:var(--tx2);padding:7px 15px;border-radius:var(--rs);font-family:var(--fb);font-size:13px;cursor:pointer;transition:all .2s;margin-bottom:10px;display:inline-flex;align-items:center;gap:6px}
.revbtn:hover{border-color:var(--acd);color:var(--ac)}
.revbtn.open{border-color:var(--acd);color:var(--ac);background:rgba(200,160,32,.05)}
.expl{display:none;background:rgba(255,255,255,.025);border:1px solid var(--bd2);border-radius:var(--rs);padding:12px 15px;font-size:14px;line-height:1.6;color:var(--tx)}
.expl.show{display:block;animation:fup .22s ease forwards}
.expl .albl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ok);margin-bottom:6px}
.expl .albl.wrong{color:var(--no)}
.expl code{font-family:var(--fm);font-size:12px;color:var(--bl);background:rgba(77,148,255,.08);padding:1px 6px;border-radius:3px}

/* EXAM MODE */
body.exam .pbtn[data-p="teoria"],
body.exam .pbtn[data-p="tips"]{opacity:.25;pointer-events:none}
body.exam .panel.tpanel,
body.exam .panel.tipanel{display:none!important}

/* RESPONSIVE */
@media(max-width:580px){
  header{padding:11px 14px}
  main{padding:16px 13px 60px}
  .ttab{padding:10px 13px;font-size:12px}
  .pbtn{font-size:12px;padding:6px 8px}
  .thead h2{font-size:22px}
  .opt{font-size:13px}
}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a38;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3a3a50}
</style>
</head>
<body>
<header>
  <div class="hbrand">
    <h1>Investigación Operativa</h1>
    <p>UTN · Guía de estudio · 1er Parcial</p>
  </div>
  <div class="hright">
    <div id="timer">60:00</div>
    <button class="btn-ex" id="btnex">Modo Examen</button>
  </div>
</header>
<nav id="tnav"></nav>
<main id="main"></main>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────

const TOPICS = [
{
  id:'sim', name:'Simulación', sub:'8 preguntas · Transformada inversa, Monte Carlo, DES',
  teoria:[
    { ttl:'Método Transformada Inversa',
      items:['Si U ~ Uniform(0,1) y F es la CDF de X, entonces <code>X = F⁻¹(U)</code> tiene distribución F',
             'Permite muestrear cualquier distribución con CDF invertible analíticamente',
             'Ventaja principal: garantizado si existe F⁻¹ en forma cerrada'],
      fmls:['X = F⁻¹(U),   U ~ Uniform(0,1)','Exponencial: X = −ln(U) / λ'],
      diag:`<svg width="100%" height="62" viewBox="0 0 560 62" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#484440"/></marker></defs>
<line x1="20" y1="33" x2="520" y2="33" stroke="#2a2a3c" stroke-width="1.5" marker-end="url(#ah1)"/>
<text x="528" y="37" fill="#484440" font-size="11" font-family="Fira Code">t</text>
<polygon points="80,33 74,16 86,16" fill="#c8a020" opacity=".85"/><text x="80" y="53" text-anchor="middle" fill="#887f70" font-size="10" font-family="Fira Code">A₁</text>
<polygon points="160,33 154,16 166,16" fill="#c8a020" opacity=".85"/><text x="160" y="53" text-anchor="middle" fill="#887f70" font-size="10" font-family="Fira Code">A₂</text>
<circle cx="225" cy="33" r="5" fill="#4d94ff" opacity=".9"/><text x="225" y="53" text-anchor="middle" fill="#4d94ff" font-size="10" font-family="Fira Code">S₁</text>
<polygon points="300,33 294,16 306,16" fill="#c8a020" opacity=".85"/><text x="300" y="53" text-anchor="middle" fill="#887f70" font-size="10" font-family="Fira Code">A₃</text>
<circle cx="380" cy="33" r="5" fill="#4d94ff" opacity=".9"/><text x="380" y="53" text-anchor="middle" fill="#4d94ff" font-size="10" font-family="Fira Code">S₂</text>
<polygon points="450,33 444,16 456,16" fill="#c8a020" opacity=".65"/><text x="450" y="53" text-anchor="middle" fill="#887f70" font-size="10" font-family="Fira Code">A₄</text>
<text x="20" y="12" fill="#887f70" font-size="9" font-family="Fira Code">▲ = llegada   ● = fin de servicio</text></svg>`
    },
    { ttl:'Distribución Exponencial',
      items:['Única distribución continua sin memoria: <code>P(X > s+t | X > s) = P(X > t)</code>',
             'Parámetro λ = tasa (eventos por unidad de tiempo)',
             'Media = 1/λ, Varianza = 1/λ²',
             'Modela tiempos entre llegadas y tiempos de servicio en sistemas M/M/c'],
      fmls:['F(x) = 1 − e^{−λx},   x ≥ 0','E[X] = 1/λ     Var[X] = 1/λ²']
    },
    { ttl:'Simulación de Eventos Discretos (DES)',
      items:['El sistema cambia de estado solo en instantes discretos (eventos)',
             'La Future Event List (FEL) contiene los próximos eventos ordenados por tiempo',
             'El reloj de simulación salta al próximo evento — no avanza segundo a segundo',
             'Tipos de eventos: llegada, inicio de servicio, fin de servicio, etc.'],
      fmls:['Algoritmo: mientras FEL ≠ ∅: extraer evento mínimo → procesar → insertar nuevos eventos']
    },
    { ttl:'Monte Carlo',
      items:['Estima cantidades mediante muestreo aleatorio repetido',
             'Con pocas muestras el estimador es inestable (alta varianza)',
             'Error estándar ∝ 1/√n → para reducir error a la mitad, necesitás 4× las muestras',
             'No simula la dinámica temporal — solo evalúa una función con entradas aleatorias'],
      fmls:['Error estándar ≈ σ / √n']
    },
    { ttl:'Ajuste de Distribuciones (MLE)',
      items:['Máxima Verosimilitud (MLE): encontrar θ que maximiza la probabilidad de observar los datos',
             'Para la exponencial: λ̂ = n / Σxᵢ = 1 / x̄',
             'Después de ajustar, validar con test χ² o Kolmogorov-Smirnov'],
      fmls:['L(θ) = Π f(xᵢ ; θ)   →   maximizar log L(θ)','Exponencial MLE: λ̂ = 1 / x̄']
    }
  ],
  tips:[
    {icon:'⚠', danger:false, lbl:'A tener en cuenta', tx:'El orden de procesamiento de eventos simultáneos NO importa para el resultado estadístico final.'},
    {icon:'🚨', danger:true,  lbl:'Error común', tx:'Con pocas iteraciones Monte Carlo el resultado es inestable. Necesitás cientos o miles de repeticiones para que los estimadores converjan.'},
    {icon:'✓', danger:false, lbl:'Propiedad clave', tx:'La exponencial tiene la propiedad sin memoria (memoryless). Esto justifica su uso en sistemas de Markov: el futuro no depende de cuánto tiempo lleva en el estado actual.'},
    {icon:'⚠', danger:true,  lbl:'Trampa de examen', tx:'Siempre verificar que U sea <code>Uniform(0,1)</code> antes de aplicar la transformada inversa. Si U viene de otra distribución, la fórmula no vale.'},
    {icon:'✓', danger:false, lbl:'DES', tx:'En simulación de colas distinguí tiempo de llegada vs. tiempo de inicio de servicio — si hay cola, el cliente llega pero no empieza a ser atendido inmediatamente.'},
    {icon:'💡', danger:false, lbl:'Tip', tx:'Para la exponencial podés usar tanto U como (1−U) en la transformada inversa, ya que ambas son Uniform(0,1). En la práctica se usa U = −ln(U)/λ.'},
  ],
  preguntas:[
    {type:'mc', txt:'¿Cuál es la fórmula correcta para generar una variable exponencial con tasa λ usando la transformada inversa?',
     opts:['X = −ln(U) / λ','X = ln(U) / λ','X = e^(−λU)','X = 1 − e^(−λU)'], cor:0,
     expl:'La CDF exponencial es F(x) = 1 − e^(−λx). Despejando: si U = F(X), entonces e^(−λX) = 1−U, tomando logaritmo: X = −ln(1−U)/λ. Como (1−U) también es Uniform(0,1), se simplifica a <code>X = −ln(U)/λ</code>.'},
    {type:'tf', txt:'Una simulación de Monte Carlo con 10 iteraciones es suficiente para obtener resultados confiables.',
     cor:false,
     expl:'<span class="albl wrong">FALSO.</span> El error estándar de Monte Carlo es σ/√n. Con n=10, la varianza del estimador es muy alta. Se necesitan cientos o miles de muestras para que los resultados sean estadísticamente robustos.'},
    {type:'open', txt:'Si U = 0.7 y λ = 2, ¿cuál es el tiempo entre llegadas generado con la transformada inversa?',
     ans:'<span class="albl">RESOLUCIÓN</span>X = −ln(U) / λ = −ln(0.7) / 2 ≈ 0.3567 / 2 ≈ <strong>0.178 unidades de tiempo</strong><br><br>Paso a paso: ln(0.7) ≈ −0.3567, luego X = −(−0.3567)/2 = 0.3567/2 ≈ 0.178.'},
    {type:'open', txt:'¿Qué propiedad hace que la distribución exponencial sea especialmente útil en simulación de colas (y en cadenas de Markov)?',
     ans:'<span class="albl">RESPUESTA</span>La propiedad <strong>sin memoria (memoryless)</strong>: <code>P(X > s+t | X > s) = P(X > t)</code>.<br><br>Esto implica que el tiempo restante hasta el próximo evento no depende de cuánto tiempo ya pasó. En Markov continuo, esta propiedad es la que garantiza que los tiempos de permanencia en un estado sean exponenciales.'},
    {type:'open', txt:'En una simulación de eventos discretos, ¿qué representa la "Future Event List" (FEL o cola de eventos futuros)?',
     ans:'<span class="albl">RESPUESTA</span>La FEL es una <strong>cola de prioridad</strong> que contiene todos los eventos programados para el futuro, ordenados por tiempo de ocurrencia.<br><br>El algoritmo siempre extrae el evento de menor tiempo, lo procesa (actualizando el estado del sistema), y puede insertar nuevos eventos como consecuencia. Así el reloj de simulación "salta" de evento en evento.'},
    {type:'mc', txt:'¿Cuál es la diferencia principal entre simulación de Monte Carlo y simulación de eventos discretos (DES)?',
     opts:['Monte Carlo modela dinámica temporal; DES evalúa funciones con entradas aleatorias','DES modela la evolución temporal del sistema; Monte Carlo estima cantidades por muestreo repetido sin modelar el tiempo','Ambas son equivalentes para modelar colas','Monte Carlo requiere más iteraciones que DES para el mismo nivel de precisión'],
     cor:1,
     expl:'<code>DES</code> modela explícitamente cómo evoluciona el sistema en el tiempo (clientes llegando, siendo atendidos, saliendo). <code>Monte Carlo</code> evalúa una función con entradas aleatorias para estimar una cantidad esperada — no hay "reloj de simulación" ni secuencia de eventos.'},
    {type:'mc', txt:'En una simulación de un sistema de colas, la longitud de la cola crece indefinidamente con el tiempo. ¿Qué indica esto?',
     opts:['Que el sistema tiene muchos clientes — es normal','Que el sistema es inestable: la tasa de llegadas supera la capacidad de servicio (ρ ≥ 1)','Que hay un bug en la simulación','Que hay que aumentar el tiempo de simulación'],
     cor:1,
     expl:'Una cola que crece sin límite indica <strong>inestabilidad</strong>: la tasa de llegadas λ es igual o mayor que la tasa de servicio c·μ, por lo que ρ = λ/(c·μ) ≥ 1. En este régimen el sistema nunca llega a estado estacionario.'},
    {type:'open', txt:'¿Por qué se usa la distribución de Poisson (y la exponencial para tiempos entre llegadas) para modelar llegadas en sistemas reales?',
     ans:'<span class="albl">RESPUESTA</span>El <strong>proceso de Poisson</strong> modela conteo de eventos aleatorios que cumplen 3 condiciones: (1) estacionariedad (la tasa λ es constante), (2) independencia entre intervalos, (3) rareza (probabilidad de 2 eventos simultáneos ≈ 0).<br><br>Muchos sistemas reales (llamadas telefónicas, llegadas a un banco, requests a un servidor) cumplen estas condiciones aproximadamente. Los tiempos entre llegadas de un proceso de Poisson siguen distribución exponencial con media 1/λ.'},
  ]
},

// ── MARKOV ────────────────────────────────────────────────────────────────────
{
  id:'markov', name:'Cadenas de Markov', sub:'10 preguntas · Discretas, continuas, estado estacionario',
  teoria:[
    { ttl:'Definición y Matriz de Transición',
      items:['Una cadena de Markov es un proceso estocástico donde el futuro depende solo del estado actual (propiedad de Markov)',
             'La matriz de transición T: Tᵢⱼ = P(Xₙ₊₁ = j | Xₙ = i)',
             '<strong>Las filas de T suman 1</strong> (no las columnas)',

// ── STATE ─────────────────────────────────────────────────────────────────────
const state = {
  activeTopic: 0,
  panels: {},       // topicIdx → 'teoria'|'tips'|'preguntas'
  answered: {},     // topicIdx → Set of question indices
  examMode: false,
  timerInterval: null,
  timerSecs: 3600
};

TOPICS.forEach((_,i) => {
  state.panels[i] = 'teoria';
  state.answered[i] = new Set();
});

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderNav() {
  const nav = document.getElementById('tnav');
  nav.innerHTML = TOPICS.map((t,i) => `
    <button class="ttab${i===0?' on':''}" onclick="switchTopic(${i})">
      <span>${t.name}</span>
      <span class="bdg" id="bdg-${i}">0/${t.preguntas.length}</span>
    </button>`).join('');
}

function renderAll() {
  const main = document.getElementById('main');
  main.innerHTML = TOPICS.map((t,i) => renderTopic(t,i)).join('');
}

function renderTopic(t, i) {
  return `<div class="tsec${i===0?' on':''}" id="sec-${i}">
  <div class="thead">
    <h2>${t.name}</h2>
    <p>${t.sub}</p>
  </div>
  <div class="psw">
    <button class="pbtn on" data-p="teoria" onclick="switchPanel(${i},'teoria')">Resumen Teórico</button>
    <button class="pbtn" data-p="tips" onclick="switchPanel(${i},'tips')">Tips de Parcial</button>
    <button class="pbtn" data-p="preguntas" onclick="switchPanel(${i},'preguntas')">Preguntas (${t.preguntas.length})</button>
  </div>
  <div class="panel tpanel on" id="panel-${i}-teoria">${renderTeoria(t)}</div>
  <div class="panel tipanel" id="panel-${i}-tips">${renderTips(t)}</div>
  <div class="panel qpanel" id="panel-${i}-preguntas">${renderPreguntas(t,i)}</div>
</div>`;
}

function renderTeoria(t) {
  return `<div class="tgrid">${t.teoria.map(c => `
  <div class="tcard">
    <div class="tcard-ttl">${c.ttl}</div>
    ${c.items ? `<ul>${c.items.map(x=>`<li>${x}</li>`).join('')}</ul>` : ''}
    ${(c.fmls||[]).map(f=>`<div class="fml blk">${f}</div>`).join('')}
    ${c.diag ? `<div class="dgram">${c.diag}</div>` : ''}
  </div>`).join('')}</div>`;
}

function renderTips(t) {
  return `<div class="tipgrid">${t.tips.map(tip => `
  <div class="tipcard${tip.danger?' danger':''}">
    <div class="tipicon">${tip.icon}</div>
    <div>
      <div class="tiplbl">${tip.lbl}</div>
      <div class="tiptx">${tip.tx}</div>
    </div>
  </div>`).join('')}</div>`;
}

function renderPreguntas(t, ti) {
  const total = t.preguntas.length;
  return `
  <div class="qhdr">
    <div class="qprog-txt">Respondidas: <span id="qcnt-${ti}">0</span>/${total}</div>
  </div>
  <div class="pbar"><div class="pfill" id="pfill-${ti}" style="width:0%"></div></div>
  <div class="qlist">${t.preguntas.map((q,qi) => renderQ(q,ti,qi)).join('')}</div>`;
}

function renderQ(q, ti, qi) {
  const labels = ['A','B','C','D'];
  let body = '';
  if (q.type === 'mc') {
    body = `<div class="opts">${q.opts.map((o,oi)=>`
      <button class="opt" id="opt-${ti}-${qi}-${oi}" onclick="answerMC(${ti},${qi},${oi})">
        <span class="oltr">${labels[oi]}</span><span>${o}</span>
      </button>`).join('')}</div>`;
  } else if (q.type === 'tf') {
    body = `<div class="tfrow">
      <button class="tfbtn" id="tf-${ti}-${qi}-v" onclick="answerTF(${ti},${qi},true)">Verdadero</button>
      <button class="tfbtn" id="tf-${ti}-${qi}-f" onclick="answerTF(${ti},${qi},false)">Falso</button>
    </div>`;
  } else {
    body = `<button class="revbtn" id="rev-${ti}-${qi}" onclick="toggleReveal(${ti},${qi})">Ver respuesta ↓</button>`;
  }
  const typeLabel = q.type==='mc'?'Opción múltiple':q.type==='tf'?'Verdadero / Falso':'Respuesta abierta';
  return `<div class="qcard" id="qcard-${ti}-${qi}">
  <div class="qmeta">
    <span class="qnum">${String(qi+1).padStart(2,'0')}</span>
    <span class="qtype">${typeLabel}</span>
  </div>
  <div class="qtxt">${q.txt}</div>
  ${body}
  <div class="expl" id="expl-${ti}-${qi}">${q.expl||q.ans||''}</div>
</div>`;
}

// ── INTERACTION ───────────────────────────────────────────────────────────────
function switchTopic(i) {
  document.querySelectorAll('.tsec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.ttab').forEach(b=>b.classList.remove('on'));
  document.getElementById(`sec-${i}`).classList.add('on');
  document.querySelectorAll('.ttab')[i].classList.add('on');
  state.activeTopic = i;
  // restore panel state
  const p = state.panels[i];
  syncPanelUI(i, p);
  if (state.examMode) switchPanel(i, 'preguntas');
}

function switchPanel(ti, panel) {
  state.panels[ti] = panel;
  syncPanelUI(ti, panel);
}

function syncPanelUI(ti, panel) {
  const sec = document.getElementById(`sec-${ti}`);
  if (!sec) return;
  sec.querySelectorAll('.pbtn').forEach(b => {
    b.classList.toggle('on', b.dataset.p === panel);
  });
  ['teoria','tips','preguntas'].forEach(p => {
    const el = document.getElementById(`panel-${ti}-${p}`);
    if (el) el.classList.toggle('on', p === panel);
  });
}

function answerMC(ti, qi, chosen) {
  const q = TOPICS[ti].preguntas[qi];
  if (state.answered[ti].has(qi)) return;
  state.answered[ti].add(qi);
  const n = q.opts.length;
  for (let i = 0; i < n; i++) {
    const btn = document.getElementById(`opt-${ti}-${qi}-${i}`);
    if (!btn) continue;
    btn.disabled = true;
    if (i === q.cor) btn.classList.add('ok');
    else if (i === chosen) btn.classList.add('no');
  }
  showExpl(ti, qi);
  updateProgress(ti);
}

function answerTF(ti, qi, answer) {
  const q = TOPICS[ti].preguntas[qi];
  if (state.answered[ti].has(qi)) return;
  state.answered[ti].add(qi);
  const bV = document.getElementById(`tf-${ti}-${qi}-v`);
  const bF = document.getElementById(`tf-${ti}-${qi}-f`);
  if (!bV || !bF) return;
  bV.disabled = true; bF.disabled = true;
  const isCorrect = (answer === q.cor);
  if (answer === true)  bV.classList.add(isCorrect ? 'ok' : 'no');
  else                  bF.classList.add(isCorrect ? 'ok' : 'no');
  // highlight correct
  if (q.cor === true)   bV.classList.add('ok');
  else                  bF.classList.add('ok');
  showExpl(ti, qi);
  updateProgress(ti);
}

function toggleReveal(ti, qi) {
  if (state.answered[ti].has(qi)) {
    // toggle hide/show
    const expl = document.getElementById(`expl-${ti}-${qi}`);
    const btn = document.getElementById(`rev-${ti}-${qi}`);
    if (!expl || !btn) return;
    const showing = expl.classList.contains('show');
    expl.classList.toggle('show', !showing);
    btn.classList.toggle('open', !showing);
    btn.textContent = showing ? 'Ver respuesta ↓' : 'Ocultar ↑';
    return;
  }
  state.answered[ti].add(qi);
  showExpl(ti, qi);
  const btn = document.getElementById(`rev-${ti}-${qi}`);
  if (btn) { btn.classList.add('open'); btn.textContent = 'Ocultar ↑'; }
  updateProgress(ti);
}

function showExpl(ti, qi) {
  const expl = document.getElementById(`expl-${ti}-${qi}`);
  const card = document.getElementById(`qcard-${ti}-${qi}`);
  if (expl) expl.classList.add('show');
  if (card) card.classList.add('answered');
}

function updateProgress(ti) {
  const total = TOPICS[ti].preguntas.length;
  const done = state.answered[ti].size;
  const pct = Math.round((done/total)*100);
  const cnt = document.getElementById(`qcnt-${ti}`);
  const fill = document.getElementById(`pfill-${ti}`);
  const bdg = document.getElementById(`bdg-${ti}`);
  if (cnt) cnt.textContent = done;
  if (fill) fill.style.width = pct + '%';
  if (bdg) {
    bdg.textContent = `${done}/${total}`;
    bdg.classList.toggle('done', done === total);
  }
}

// ── EXAM MODE ─────────────────────────────────────────────────────────────────
let timerSecs = 3600;
let timerInterval = null;

document.getElementById('btnex').addEventListener('click', () => {
  state.examMode = !state.examMode;
  document.body.classList.toggle('exam', state.examMode);
  const btn = document.getElementById('btnex');
  const timerEl = document.getElementById('timer');
  btn.classList.toggle('on', state.examMode);
  btn.textContent = state.examMode ? 'Salir del Examen' : 'Modo Examen';

  if (state.examMode) {
    // switch all visible panels to preguntas
    TOPICS.forEach((_,i) => switchPanel(i, 'preguntas'));
    syncPanelUI(state.activeTopic, 'preguntas');
    timerSecs = 3600;
    timerEl.style.display = 'block';
    updateTimerDisplay();
    timerInterval = setInterval(() => {
      timerSecs--;
      updateTimerDisplay();
      if (timerSecs <= 0) {
        clearInterval(timerInterval);
        timerEl.textContent = '¡TIEMPO!';
      }
    }, 1000);
  } else {
    clearInterval(timerInterval);
    timerEl.style.display = 'none';
    // restore panels to teoria
    TOPICS.forEach((_,i) => {
      state.panels[i] = 'teoria';
      syncPanelUI(i, 'teoria');
    });
    syncPanelUI(state.activeTopic, 'teoria');
  }
});

function updateTimerDisplay() {
  const el = document.getElementById('timer');
  const m = Math.floor(timerSecs / 60);
  const s = timerSecs % 60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.classList.toggle('urgent', timerSecs <= 300 && timerSecs > 0);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderNav();
renderAll();
</script>
